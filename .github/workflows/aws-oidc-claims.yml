name: AWS - Inspect OIDC claims
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment whose trust will be configured
        type: choice
        default: hml-plan
        options: [hml-plan, hml, hml-drift]
        required: true
permissions:
  contents: read
jobs:
  claims:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/oidc_claims.py
