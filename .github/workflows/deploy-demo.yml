name: Terraform deploy demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-prod-demo
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  plan:
    if: ${{ vars.ENABLE_DEMO_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.14.7"
          terraform_wrapper: false
      - uses: open-policy-agent/setup-opa@34a30e8a924d1b03ce2cf7abe97250bbb1f332b5 # v2.2.0
        with:
          version: "1.20.2"
      - name: Plan and policy on this commit
        run: |
          terraform -chdir=infra fmt -check -diff
          terraform -chdir=infra init -backend=false -input=false
          terraform -chdir=infra validate -no-color
          terraform -chdir=infra plan -input=false -no-color -out=tfplan
          terraform -chdir=infra show -json tfplan > infra/tfplan.json
          opa eval --fail-defined --data policies/opa \
            --input infra/tfplan.json 'data.terraform.guard.deny[_]'
      - name: Publish deployment plan before approval
        run: |
          {
            echo '### Deployment plan (synthetic data only)'
            echo "Commit: $GITHUB_SHA"
            echo "Run: $GITHUB_RUN_ID / attempt: $GITHUB_RUN_ATTEMPT"
            echo '```text'
            terraform -chdir=infra show -no-color tfplan
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: demo-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: infra/tfplan
          if-no-files-found: error
          retention-days: 1

  apply:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: prod-demo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.14.7"
          terraform_wrapper: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: demo-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: infra
      - name: Apply approved saved plan
        run: |
          terraform -chdir=infra init -backend=false -input=false
          terraform -chdir=infra apply -input=false -no-color tfplan
          echo 'Synthetic apply completed; no AWS resources created.' >> "$GITHUB_STEP_SUMMARY"
