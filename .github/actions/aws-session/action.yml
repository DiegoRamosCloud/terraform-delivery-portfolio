name: AWS lab session
description: Pinned tools and short-lived AWS credentials; permissions belong to the calling job.
inputs:
  role-arn:
    description: Environment-specific IAM role
    required: true
  aws-region:
    description: AWS region
    required: true
  account-id:
    description: Expected AWS account
    required: true
runs:
  using: composite
  steps:
    - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
      with:
        terraform_version: "1.14.7"
        terraform_wrapper: false
    - uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # v6.0.0
      with:
        aws-region: ${{ inputs.aws-region }}
        role-to-assume: ${{ inputs.role-arn }}
        allowed-account-ids: ${{ inputs.account-id }}
        role-session-name: portfolio-${{ github.run_id }}-${{ github.run_attempt }}
        role-duration-seconds: 900
        retry-max-attempts: 3
        mask-aws-account-id: true
